project:
  name: ira_quant_dashboard
  base_currency: USD
  output_path: data/processed/current_universe.csv

export_settings:
  standard_csv:
    delimiter: ","
    decimal: "."
    encoding: "utf-8"

  excel_csv:
    enabled: true
    delimiter: ";"
    decimal: ","
    encoding: "utf-8-sig"
    suffix: "_excel"

universe_schema:
  required_columns:
    - ticker
    - universe_name
    - source_type
    - strategy_role
    - account_target
    - active

  optional_columns:
    - company_name
    - asset_type
    - source_name
    - target_weight
    - sector
    - industry
    - cusip
    - cik
    - date_added
    - as_of_date
    - notes

# Can change and add 'universes'
universes:
  - universe_name: sp500_value
    enabled: true
    source_type: manual
    source_name: sp500_value_manual
    input_path: data/manual/sp500_value_manual.csv
    input_format:
      delimiter: ";"
      decimal: ","
    strategy_role: value
    account_target: paper
    default_asset_type: stock

  - universe_name: burry_autopilot
    enabled: true
    source_type: manual
    source_name: burry_autopilot_manual
    input_path: data/manual/burry_autopilot_manual.csv
    # My excel set-up is in international format with semicolon-seperated values and comma as the decimal
    # For US users, these formats can be adjusted accordingly 
    input_format:
      delimiter: ";"
      decimal: ","
    strategy_role: value_contrarian
    account_target: rollover_ira
    default_asset_type: stock

  - universe_name: simons_autopilot
    enabled: false
    source_type: manual
    source_name: simons_autopilot_manual
    input_path: data/manual/simons_autopilot_manual.csv
    strategy_role: aggressive_growth
    account_target: roth_ira
    default_asset_type: stock

  - universe_name: burry_13f_future
    enabled: false
    source_type: sec_13f
    source_name: scion_asset_management
    manager_cik: "0001649339"
    form_type: "13F-HR"
    lookback_quarters: 1
    strategy_role: value_contrarian
    account_target: paper
    default_asset_type: stock

price_history:
  enabled: true
  input_universe_path: data/processed/current_universe.csv
  output_path: data/prices/price_history.csv
  provider: yfinance
  start_date: "2020-01-01"
  end_date: null
  interval: "1d"
  auto_adjust: false

  tradable_asset_types:
    - stock
    - equity
    - etf
    - fund

price_factors:
  enabled: true
  input_price_path: data/prices/price_history.csv
  output_history_path: data/features/price_factors_history.csv
  output_latest_path: data/features/latest_price_factors.csv
  price_column: adjusted_close
  trading_days_per_year: 252

  return_windows:
    1w: 5
    4w: 20
    13w: 63
    26w: 126
    52w: 252

  high_windows:
    13w: 63
    52w: 252

  moving_average_windows:
    - 20
    - 50
    - 200

  volatility_windows:
    - 20
    - 60

price_scores:
  enabled: true
  input_latest_factors_path: data/features/latest_price_factors.csv
  input_universe_path: data/processed/current_universe.csv
  output_scores_path: data/scores/latest_price_scores.csv

  score_weights:
    dip_score: 0.35
    trend_score: 0.30
    momentum_score: 0.20
    risk_score: 0.15

  risk_adjustment:
    enabled: true
    high_volatility_threshold: 0.50
    severe_volatility_threshold: 0.75
    high_volatility_penalty: 7.5
    severe_volatility_penalty: 15.0
    broken_trend_penalty: 10.0
    severe_broken_trend_penalty: 20.0

  signal_thresholds:
    moderate_dip: -0.05
    deep_dip: -0.10
    severe_dip: -0.20
    near_high: -0.03
    above_200d_ma: 0.00
    slightly_below_200d_ma: -0.05
    broken_trend: -0.10
    positive_13w_return: 0.00
    strong_13w_return: 0.10
    high_volatility: 0.50
    severe_volatility: 0.75

sec_api:
  base_url: "https://data.sec.gov"
  company_tickers_url: "https://www.sec.gov/files/company_tickers.json"
  companyfacts_base_url: "https://data.sec.gov/api/xbrl/companyfacts"
  user_agent_env: "SEC_USER_AGENT"
  request_delay_seconds: 0.15
  max_retries: 3
  timeout_seconds: 30
  cache_enabled: true
  cache_dir: data/sec/cache
  reference_dir: data/sec/reference

sec_reference:
  enabled: true
  company_tickers_output_path: data/sec/reference/company_tickers.csv
  force_refresh: false

sec_company_facts:
  enabled: true
  input_universe_path: data/processed/current_universe.csv
  input_cik_reference_path: data/sec/reference/company_tickers.csv
  output_summary_path: data/fundamentals/sec_company_facts_summary.csv
  facts_cache_dir: data/sec/cache/companyfacts
  force_refresh: false

  tradable_asset_types:
    - stock

sec_accounting_concepts:
  enabled: true
  input_company_facts_summary_path: data/fundamentals/sec_company_facts_summary.csv
  facts_cache_dir: data/sec/cache/companyfacts
  output_path: data/fundamentals/sec_accounting_concepts.csv

  preferred_forms:
    - 10-K
    - 10-Q
    - 20-F
    - 40-F

  annual_forms:
    - 10-K
    - 20-F
    - 40-F

  quarterly_forms:
    - 10-Q

  metric_period_types:
    revenue: duration_annual
    net_income: duration_annual
    operating_income: duration_annual
    operating_cash_flow: duration_annual
    capex: duration_annual
    assets: instant_latest
    liabilities: instant_latest
    stockholders_equity: instant_latest

  concepts:
    revenue:
      taxonomy: us-gaap
      candidates:
        - Revenues
        - RevenueFromContractWithCustomerExcludingAssessedTax
        - SalesRevenueNet

    net_income:
      taxonomy: us-gaap
      candidates:
        - NetIncomeLoss
        - ProfitLoss

    assets:
      taxonomy: us-gaap
      candidates:
        - Assets

    liabilities:
      taxonomy: us-gaap
      candidates:
        - Liabilities

    stockholders_equity:
      taxonomy: us-gaap
      candidates:
        - StockholdersEquity
        - StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest

    operating_income:
      taxonomy: us-gaap
      candidates:
        - OperatingIncomeLoss

    operating_cash_flow:
      taxonomy: us-gaap
      candidates:
        - NetCashProvidedByUsedInOperatingActivities
        - NetCashProvidedByUsedInOperatingActivitiesContinuingOperations

    capex:
      taxonomy: us-gaap
      candidates:
        - PaymentsToAcquirePropertyPlantAndEquipment
        - PaymentsToAcquireProductiveAssets
sec_fundamental_factors:
  enabled: true
  input_accounting_concepts_path: data/fundamentals/sec_accounting_concepts.csv
  output_path: data/fundamentals/latest_fundamental_factors.csv

  required_metrics:
    - revenue
    - net_income
    - assets
    - stockholders_equity
    - operating_cash_flow
    - capex

  optional_metrics:
    - liabilities
    - operating_income

  min_required_metrics_present: 4

fundamental_scores:
  enabled: true
  input_fundamental_factors_path: data/fundamentals/latest_fundamental_factors.csv
  output_scores_path: data/scores/latest_fundamental_scores.csv

  score_weights:
    quality_score: 0.45
    cash_flow_score: 0.30
    balance_sheet_score: 0.25

  quality_metrics:
    return_on_equity: higher
    net_margin: higher
    operating_margin: higher
    asset_turnover: higher

  cash_flow_metrics:
    fcf_margin: higher
    operating_cash_flow_to_net_income: higher

  balance_sheet_metrics:
    liabilities_to_assets: lower
    equity_to_assets: higher

  penalty_settings:
    negative_net_income_penalty: 15.0
    negative_free_cash_flow_penalty: 12.5
    high_liabilities_penalty: 10.0
    negative_equity_penalty: 25.0
    limited_data_penalty: 10.0