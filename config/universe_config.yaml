project:
  name: ira_quant_dashboard
  base_currency: USD
  output_path: data/processed/current_universe.csv

export_settings:
  standard_csv:
    delimiter: ","
    decimal: "."
    encoding: "utf-8"

  excel_csv:
    enabled: true
    delimiter: ";"
    decimal: ","
    encoding: "utf-8-sig"
    suffix: "_excel"

universe_schema:
  required_columns:
    - ticker
    - universe_name
    - source_type
    - strategy_role
    - account_target
    - active

  optional_columns:
    - company_name
    - asset_type
    - source_name
    - target_weight
    - sector
    - industry
    - cusip
    - cik
    - date_added
    - as_of_date
    - notes

# Can change and add 'universes'
universes:
  - universe_name: sp500_value
    enabled: true
    source_type: manual
    source_name: sp500_value_manual
    input_path: data/manual/sp500_value_manual.csv
    input_format:
      delimiter: ";"
      decimal: ","
    strategy_role: value
    account_target: paper
    default_asset_type: stock

  - universe_name: burry_autopilot
    enabled: true
    source_type: manual
    source_name: burry_autopilot_manual
    input_path: data/manual/burry_autopilot_manual.csv
    # My excel set-up is in international format with semicolon-seperated values and comma as the decimal
    # For US users, these formats can be adjusted accordingly 
    input_format:
      delimiter: ";"
      decimal: ","
    strategy_role: value_contrarian
    account_target: rollover_ira
    default_asset_type: stock

  - universe_name: simons_autopilot
    enabled: true
    source_type: manual
    source_name: simons_autopilot_manual
    input_path: data/manual/simons_autopilot_manual.csv
    input_format:
      delimiter: ";"
      decimal: ","
    strategy_role: aggressive_growth
    account_target: roth_ira
    default_asset_type: stock

  - universe_name: burry_13f_future
    enabled: false
    source_type: sec_13f
    source_name: scion_asset_management
    manager_cik: "0001649339"
    form_type: "13F-HR"
    lookback_quarters: 1
    strategy_role: value_contrarian
    account_target: paper
    default_asset_type: stock

ticker_list_universes:
  - universe_name: example_ticker_watchlist
    enabled: false
    input_path: examples/ticker_list_template.csv
    output_path: data/manual/example_ticker_watchlist_universe.csv
    delimiter: ","
    decimal: "."
    account_target: paper
    default_source_name: example_ticker_watchlist
    default_strategy_role: manual_watchlist
    default_asset_type: stock
    weighting_method: equal_weight

price_history:
  enabled: true
  input_universe_path: data/processed/current_universe.csv
  output_path: data/prices/price_history.csv
  provider: yfinance
  start_date: "2020-01-01"
  end_date: null
  interval: "1d"
  auto_adjust: false

  tradable_asset_types:
    - stock
    - equity
    - etf
    - fund

price_factors:
  enabled: true
  input_price_path: data/prices/price_history.csv
  output_history_path: data/features/price_factors_history.csv
  output_latest_path: data/features/latest_price_factors.csv
  price_column: adjusted_close
  trading_days_per_year: 252

  return_windows:
    1w: 5
    4w: 20
    13w: 63
    26w: 126
    52w: 252

  high_windows:
    13w: 63
    52w: 252

  moving_average_windows:
    - 20
    - 50
    - 200

  volatility_windows:
    - 20
    - 60

price_scores:
  enabled: true
  input_latest_factors_path: data/features/latest_price_factors.csv
  input_universe_path: data/processed/current_universe.csv
  output_scores_path: data/scores/latest_price_scores.csv

  score_weights:
    dip_score: 0.35
    trend_score: 0.30
    momentum_score: 0.20
    risk_score: 0.15

  risk_adjustment:
    enabled: true
    high_volatility_threshold: 0.50
    severe_volatility_threshold: 0.75
    high_volatility_penalty: 7.5
    severe_volatility_penalty: 15.0
    broken_trend_penalty: 10.0
    severe_broken_trend_penalty: 20.0

  signal_thresholds:
    moderate_dip: -0.05
    deep_dip: -0.10
    severe_dip: -0.20
    near_high: -0.03
    above_200d_ma: 0.00
    slightly_below_200d_ma: -0.05
    broken_trend: -0.10
    positive_13w_return: 0.00
    strong_13w_return: 0.10
    high_volatility: 0.50
    severe_volatility: 0.75

sec_api:
  base_url: "https://data.sec.gov"
  company_tickers_url: "https://www.sec.gov/files/company_tickers.json"
  companyfacts_base_url: "https://data.sec.gov/api/xbrl/companyfacts"
  user_agent_env: "SEC_USER_AGENT"
  request_delay_seconds: 0.15
  max_retries: 3
  timeout_seconds: 30
  cache_enabled: true
  cache_dir: data/sec/cache
  reference_dir: data/sec/reference

sec_reference:
  enabled: true
  company_tickers_output_path: data/sec/reference/company_tickers.csv
  force_refresh: false

sec_company_facts:
  enabled: true
  input_universe_path: data/processed/current_universe.csv
  input_cik_reference_path: data/sec/reference/company_tickers.csv
  output_summary_path: data/fundamentals/sec_company_facts_summary.csv
  facts_cache_dir: data/sec/cache/companyfacts
  force_refresh: false

  tradable_asset_types:
    - stock

sec_accounting_concepts:
  enabled: true
  input_company_facts_summary_path: data/fundamentals/sec_company_facts_summary.csv
  facts_cache_dir: data/sec/cache/companyfacts
  output_path: data/fundamentals/sec_accounting_concepts.csv

  preferred_forms:
    - 10-K
    - 10-Q
    - 20-F
    - 40-F

  annual_forms:
    - 10-K
    - 20-F
    - 40-F

  quarterly_forms:
    - 10-Q

  metric_period_types:
    revenue: duration_annual
    net_income: duration_annual
    operating_income: duration_annual
    operating_cash_flow: duration_annual
    capex: duration_annual
    assets: instant_latest
    liabilities: instant_latest
    stockholders_equity: instant_latest

  concepts:
    revenue:
      taxonomy: us-gaap
      candidates:
        - Revenues
        - RevenueFromContractWithCustomerExcludingAssessedTax
        - SalesRevenueNet

    net_income:
      taxonomy: us-gaap
      candidates:
        - NetIncomeLoss
        - ProfitLoss

    assets:
      taxonomy: us-gaap
      candidates:
        - Assets

    liabilities:
      taxonomy: us-gaap
      candidates:
        - Liabilities

    stockholders_equity:
      taxonomy: us-gaap
      candidates:
        - StockholdersEquity
        - StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest

    operating_income:
      taxonomy: us-gaap
      candidates:
        - OperatingIncomeLoss

    operating_cash_flow:
      taxonomy: us-gaap
      candidates:
        - NetCashProvidedByUsedInOperatingActivities
        - NetCashProvidedByUsedInOperatingActivitiesContinuingOperations

    capex:
      taxonomy: us-gaap
      candidates:
        - PaymentsToAcquirePropertyPlantAndEquipment
        - PaymentsToAcquireProductiveAssets

sec_fundamental_factors:
  enabled: true
  input_accounting_concepts_path: data/fundamentals/sec_accounting_concepts.csv
  output_path: data/fundamentals/latest_fundamental_factors.csv

  required_metrics:
    - revenue
    - net_income
    - assets
    - stockholders_equity
    - operating_cash_flow
    - capex

  optional_metrics:
    - liabilities
    - operating_income

  min_required_metrics_present: 4

fundamental_scores:
  enabled: true
  input_fundamental_factors_path: data/fundamentals/latest_fundamental_factors.csv
  input_universe_path: data/processed/current_universe.csv
  output_scores_path: data/scores/latest_fundamental_scores.csv

  scoring_mode: sector_relative
  min_sector_group_size: 5

  score_weights:
    quality_score: 0.45
    cash_flow_score: 0.30
    balance_sheet_score: 0.25

  quality_metrics:
    return_on_equity_scoring: higher
    net_margin_scoring: higher
    operating_margin_scoring: higher
    asset_turnover_scoring: higher

  cash_flow_metrics:
    fcf_margin_scoring: higher
    operating_cash_flow_to_net_income_scoring: higher

  balance_sheet_metrics:
    liabilities_to_assets_scoring: lower
    equity_to_assets_scoring: higher

  sanity_filters:
    enabled: true

    clipping_bounds:
      return_on_equity:
        lower: -2.0
        upper: 2.0
      net_margin:
        lower: -1.0
        upper: 1.0
      operating_margin:
        lower: -1.0
        upper: 1.0
      fcf_margin:
        lower: -1.0
        upper: 1.0
      asset_turnover:
        lower: 0.0
        upper: 5.0
      liabilities_to_assets:
        lower: 0.0
        upper: 2.0
      equity_to_assets:
        lower: -1.0
        upper: 2.0
      operating_cash_flow_to_net_income:
        lower: -5.0
        upper: 5.0

  penalty_settings:
    negative_net_income_penalty: 15.0
    negative_free_cash_flow_penalty: 12.5
    high_liabilities_penalty: 10.0
    negative_equity_penalty: 25.0
    limited_data_penalty: 10.0
    sanity_filter_penalty: 5.0

composite_scores:
  enabled: true
  input_price_scores_path: data/scores/latest_price_scores.csv
  input_fundamental_scores_path: data/scores/latest_fundamental_scores.csv
  output_scores_path: data/scores/latest_composite_scores.csv

  score_weights:
    price_score: 0.60
    fundamental_score: 0.40

  thresholds:
    strong_price_score: 65
    weak_price_score: 40
    strong_fundamental_score: 65
    weak_fundamental_score: 40
    strong_composite_score: 65
    weak_composite_score: 40

cash_deployment:
  enabled: true
  input_composite_scores_path: data/scores/latest_composite_scores.csv
  output_deployment_plan_path: data/deployment/latest_deployment_plan.csv

  account: research_portfolio
  available_cash: 1000.0
  deployable_cash_this_period: 300.0
  base_tranche_amount: 100.0
  max_candidates: 5

  eligible_signals:
    - aligned_candidate
    - timing_candidate_fundamentals_neutral
    - mixed_signal_review_required

  fundamentals_led_signals:
    - mixed_signal_review_required

  actions:
    aligned_candidate: normal_tranche
    timing_candidate_fundamentals_neutral: test_tranche
    mixed_signal_review_required: test_tranche
    possible_value_trap: watch_only
    quality_watchlist_wait_for_timing: watch_only
    low_priority: watch_only
    partial_data_review_required: watch_only

  tranche_multipliers:
    test_tranche: 0.5
    normal_tranche: 1.0
    watch_only: 0.0
    blocked_by_constraint: 0.0

  constraints:
    min_composite_score: 60.0
    min_price_score: 45.0
    min_fundamental_score: 55.0
    max_single_position_amount: 100.0
    max_sector_candidates: 2
    require_complete_data: true
    block_possible_value_traps: true

  fundamentals_led_rules:
    enabled: true
    min_fundamental_score: 65.0
    min_price_score: 50.0
    min_composite_score: 60.0
    max_tranche_multiplier: 0.5

portfolio_analysis:
  enabled: true
  input_holdings_path: data/manual/portfolio_holdings.csv
  holdings_delimiter: ","
  holdings_decimal: "."
  input_price_history_path: data/prices/price_history.csv
  input_composite_scores_path: data/scores/latest_composite_scores.csv
  input_current_universe_path: data/processed/current_universe.csv

  output_positions_path: data/portfolio/latest_portfolio_positions.csv
  output_summary_path: data/portfolio/latest_portfolio_summary.csv
  output_sector_exposure_path: data/portfolio/latest_sector_exposure.csv
  output_strategy_exposure_path: data/portfolio/latest_strategy_exposure.csv
  output_autopilot_lookthrough_path: data/portfolio/latest_autopilot_lookthrough.csv

  synthetic_strategy_tickers:
    - BURRY_AUTOPILOT
    - SIMONS_AUTOPILOT

  cash_tickers:
    - CASH_USD

  autopilot_universes:
    - burry_autopilot
    - simons_autopilot

  score_thresholds:
    strong_composite_score: 65
    weak_composite_score: 40

weekly_report:
  enabled: true

  input_composite_scores_path: data/scores/latest_composite_scores.csv
  input_deployment_plan_path: data/deployment/latest_deployment_plan.csv
  input_portfolio_positions_path: data/portfolio/latest_portfolio_positions.csv
  input_portfolio_summary_path: data/portfolio/latest_portfolio_summary.csv
  input_strategy_exposure_path: data/portfolio/latest_strategy_exposure.csv
  input_sector_exposure_path: data/portfolio/latest_sector_exposure.csv
  input_autopilot_lookthrough_path: data/portfolio/latest_autopilot_lookthrough.csv

  output_latest_report_path: reports/weekly/latest_weekly_report.md
  output_dated_report_dir: reports/weekly
  output_summary_path: data/reports/latest_weekly_report_summary.csv

  top_n_candidates: 15
  top_n_deployment_actions: 10
  top_n_holdings: 15
  top_n_autopilot_holdings: 10
  top_n_cautions: 10

  include_disclaimer: true

security_master:
  enabled: true
  path: data/reference/security_master.csv
  sec_ticker_reference_path: data/sec/reference/company_tickers.csv
  create_if_missing: true